<svg width="440" height="220" viewBox="0 0 440 220" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="card">
      <rect x="1" y="1" width="438" height="218" rx="14" ry="14"/>
    </clipPath>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="438" height="218" rx="14" ry="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="440" height="32" fill="#161b22"/>
    <line x1="0" y1="32" x2="440" y2="32" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="16" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="16" r="5" fill="#27c93f"/>
  </g>

  <text x="20" y="55" font-size="14" fill="#7ee787">filonux@nix:~$ whoami</text>
  <rect x="203" y="44" width="8" height="14" fill="#7ee787" opacity="0.85"/>

  <!-- Phi (φ) glyph: smooth vector ring + stem, symmetric ascender/descender -->
  <g filter="url(#glow)">
    <line x1="220" y1="68" x2="220" y2="168" stroke="#e3b341" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="220" cy="118" rx="27" ry="32" fill="none" stroke="#e3b341" stroke-width="7"/>
  </g>

  <text x="220.0" y="196" font-size="16" font-weight="700" letter-spacing="4" fill="#e3b341" text-anchor="middle">FILONUX TOOLS</text>
</svg>
