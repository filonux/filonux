<svg xmlns="http://www.w3.org/2000/svg" width="222" height="44" viewBox="0 0 222 44" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-labelledby="title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">filonux@proton.me</title>
  <!-- haz de luz que recorre el borde en sentido horario: una vuelta cada 8 s, a velocidad constante.
       Solo se anima stroke-dashoffset (sin JS, barato de pintar). Si el sistema pide menos movimiento
       se oculta y queda el boton estatico de siempre. Es ambar (el del sobre) y no verde porque asi
       contrasta con el borde, que es verde translucido, tanto en el tema oscuro como en el claro. -->
  <style>
    .beam { animation: orbit 8s linear infinite }
    @keyframes orbit { to { stroke-dashoffset: -506.83 } }
    @media (prefers-reduced-motion: reduce) { .beam { display: none } }
  </style>
  <defs>
    <!-- borde exterior del trazo: el halo solo puede verse hacia dentro, nunca por fuera del boton -->
    <clipPath id="edge">
      <rect x="0.25" y="0.25" width="221.5" height="43.5" rx="10.75" ry="10.75"/>
    </clipPath>
    <!-- halo: se aplica solo a copias difuminadas DEBAJO del trazo nitido, nunca a este -->
    <filter id="bloom" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="220" height="42" rx="10" ry="10" fill="#0d1117" stroke="#7ee787" stroke-opacity="0.6" stroke-width="1.5"/>
  <!-- perimetro del borde: 2 x 200 + 2 x 22 + 2 x pi x 10 = 506.83. Cada stroke-dasharray suma justo eso
       (opcional 0 inicial, el hueco que coloca el tramo, el tramo y el resto), asi todas las capas comparten
       keyframes, avanzan igual y el bucle no da saltos. Cabo plano (por defecto): el 0 inicial no pinta nada.
       Todas terminan en el mismo punto, el cabezal: estela de 120 px que gana intensidad hacia el frente
       (3 capas que el desenfoque funde en una sola) y trazo nitido de 24 px. El grupo exterior recorta
       y el interior difumina: primero el filtro y despues el recorte, en ese orden. -->
  <g clip-path="url(#edge)">
    <g fill="none" stroke="#e3b341" stroke-width="4" filter="url(#bloom)">
      <rect class="beam" x="1" y="1" width="220" height="42" rx="10" ry="10" stroke-opacity="0.2" stroke-dasharray="120 386.83"/>
      <rect class="beam" x="1" y="1" width="220" height="42" rx="10" ry="10" stroke-opacity="0.26" stroke-dasharray="0 60 60 386.83"/>
      <rect class="beam" x="1" y="1" width="220" height="42" rx="10" ry="10" stroke-opacity="0.42" stroke-dasharray="0 96 24 386.83"/>
    </g>
  </g>
  <rect class="beam" x="1" y="1" width="220" height="42" rx="10" ry="10" fill="none" stroke="#f2cc60" stroke-width="1.5" stroke-dasharray="0 96 24 386.83"/>
  <g fill="none" stroke="#e3b341" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="18" y="15" width="20" height="14" rx="2.5" ry="2.5"/>
    <path d="M19.5 17.5L28 23.5L36.5 17.5"/>
  </g>
  <text x="50" y="27" font-size="15" fill="#7ee787" textLength="153" lengthAdjust="spacing">filonux@proton.me</text>
</svg>
