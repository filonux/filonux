<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-labelledby="title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">FILONUX TOOLS</title>
  <!-- cursor parpadeante (visible/oculto a partes iguales); fijo si el sistema pide menos movimiento -->
  <style>
    .cursor { animation: blink 1.1s step-end infinite }
    @keyframes blink { 50% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none } }
  </style>
  <defs>
    <clipPath id="card">
      <rect x="1" y="1" width="438" height="218" rx="14" ry="14"/>
    </clipPath>
    <!-- halo tipo fosforo de CRT: se aplica solo a una copia difuminada DEBAJO
         del glifo nitido, nunca al glifo en si -->
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <!-- Phi (Φ) en pixel-art sobre una rejilla de 16x20 celdas de 5px (80x100px):
         aro eliptico de 2 celdas de grosor + asta de 2 celdas que sobresale 3 por
         arriba y por abajo con remates de 8 celdas, como un glifo de fuente de
         terminal (VGA/BIOS). Un unico <path> con coordenadas enteras: bordes
         nitidos, simetria exacta y sin costuras entre celdas. -->
    <path id="phi" d="M200 73h40v5h-40zM215 78h10v10h-10zM205 88h30v5h-30zM195 93h50v5h-50zM190 98h15v5h-15zM215 98h10v50h-10zM235 98h15v5h-15zM185 103h15v5h-15zM240 103h15v5h-15zM185 108h10v5h-10zM245 108h10v5h-10zM180 113h10v20h-10zM250 113h10v20h-10zM185 133h10v5h-10zM245 133h10v5h-10zM185 138h15v5h-15zM240 138h15v5h-15zM190 143h15v5h-15zM235 143h15v5h-15zM195 148h50v5h-50zM205 153h30v5h-30zM215 158h10v10h-10zM200 168h40v5h-40z"/>
  </defs>

  <rect x="1" y="1" width="438" height="218" rx="14" ry="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="440" height="32" fill="#161b22"/>
    <line x1="0" y1="32" x2="440" y2="32" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="16" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="16" r="5" fill="#27c93f"/>
  </g>

  <!-- textLength fija el ancho del prompt (21 caracteres x 8.4px) para que el cursor
       quede pegado al texto con cualquier fuente monoespaciada -->
  <text x="20" y="55" font-size="14" fill="#7ee787" textLength="176.4" lengthAdjust="spacing">filonux@nix:~$ whoami</text>
  <rect class="cursor" x="205" y="44" width="8" height="14" fill="#7ee787" opacity="0.85"/>

  <use href="#phi" fill="#e3b341" opacity="0.55" filter="url(#bloom)"/>
  <use href="#phi" fill="#e3b341" shape-rendering="crispEdges"/>

  <text x="221.6" y="200" font-size="16" font-weight="700" letter-spacing="4" fill="#e3b341" text-anchor="middle">FILONUX TOOLS</text>
</svg>
