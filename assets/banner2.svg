<svg xmlns="http://www.w3.org/2000/svg" width="440" height="198" viewBox="0 0 440 198" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-labelledby="title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">FILONUX TOOLS</title>
  <!-- cursor parpadeante (visible/oculto a partes iguales); fijo si el sistema pide menos movimiento -->
  <style>
    .cursor { animation: blink 1.1s step-end infinite }
    @keyframes blink { 50% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none } }
  </style>
  <defs>
    <clipPath id="card">
      <rect x="1" y="1" width="438" height="196" rx="14" ry="14"/>
    </clipPath>
    <!-- halo tipo fosforo de CRT: se aplica solo a una copia difuminada DEBAJO
         del glifo nitido, nunca al glifo en si -->
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <!-- Phi (Φ) en pixel-art sobre una rejilla de 16x20 celdas de 5px (80x100px):
         aro eliptico de 2 celdas de grosor + asta de 2 celdas que sobresale 3 por
         arriba y por abajo con remates de 8 celdas, como un glifo de fuente de
         terminal (VGA/BIOS). Un unico <path> con coordenadas enteras: bordes
         nitidos, simetria exacta y sin costuras entre celdas. -->
    <path id="phi" d="M200 67h40v5h-40zM215 72h10v10h-10zM205 82h30v5h-30zM195 87h50v5h-50zM190 92h15v5h-15zM215 92h10v50h-10zM235 92h15v5h-15zM185 97h15v5h-15zM240 97h15v5h-15zM185 102h10v5h-10zM245 102h10v5h-10zM180 107h10v20h-10zM250 107h10v20h-10zM185 127h10v5h-10zM245 127h10v5h-10zM185 132h15v5h-15zM240 132h15v5h-15zM190 137h15v5h-15zM235 137h15v5h-15zM195 142h50v5h-50zM205 147h30v5h-30zM215 152h10v10h-10zM200 162h40v5h-40z"/>
  </defs>

  <rect x="1" y="1" width="438" height="196" rx="14" ry="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="440" height="32" fill="#161b22"/>
    <line x1="0" y1="32" x2="440" y2="32" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="16" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="16" r="5" fill="#27c93f"/>
  </g>

  <!-- textLength fija el ancho del prompt (21 caracteres x 8.4px) para que el cursor
       quede pegado al texto con cualquier fuente monoespaciada -->
  <text x="20" y="55" font-size="14" fill="#7ee787" textLength="176.4" lengthAdjust="spacing">filonux@nix:~$ whoami</text>
  <!-- cursor: bloque solido de 10x15 en la celda 22 del prompt (20 + 22 x 8.4 = 204.8), centrado en
       vertical sobre el texto; mismo verde que el texto y bordes nitidos, como el Phi -->
  <rect class="cursor" x="205" y="43.5" width="10" height="15" fill="#7ee787" shape-rendering="crispEdges"/>

  <use href="#phi" fill="#e3b341" opacity="0.55" filter="url(#bloom)"/>
  <use href="#phi" fill="#e3b341" shape-rendering="crispEdges"/>

  <text x="221.6" y="188" font-size="16" font-weight="700" letter-spacing="4" fill="#e3b341" text-anchor="middle">FILONUX TOOLS</text>
</svg>
