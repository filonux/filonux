<svg xmlns="http://www.w3.org/2000/svg" width="222" height="44" viewBox="0 0 222 44" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-labelledby="title">
  <title id="title">Support my work</title>
  <!-- Mismo haz de luz que email.svg: una vuelta cada 8 s solo con stroke-dashoffset (sin JS).
       Perímetro del borde = 2×200 + 2×22 + 2×π×10 = 506.83; cada dasharray suma justo eso para que el bucle no dé saltos.
       El cursor parpadea como el del banner. Con prefers-reduced-motion se oculta el haz y el cursor queda fijo. -->
  <style>
    .beam { animation: orbit 8s linear infinite }
    @keyframes orbit { to { stroke-dashoffset: -506.83 } }
    .cursor { animation: blink 1.1s step-end infinite }
    @keyframes blink { 50% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .beam { display: none } .cursor { animation: none } }
  </style>
  <defs>
    <clipPath id="edge">
      <rect x="0.25" y="0.25" width="221.5" height="43.5" rx="10.75" ry="10.75"/>
    </clipPath>
    <filter id="bloom" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="220" height="42" rx="10" ry="10" fill="#0d1117" stroke="#7ee787" stroke-opacity="0.6" stroke-width="1.5"/>
  <g clip-path="url(#edge)">
    <g fill="none" stroke="#e3b341" stroke-width="4" filter="url(#bloom)">
      <rect class="beam" x="1" y="1" width="220" height="42" rx="10" ry="10" stroke-opacity="0.2" stroke-dasharray="120 386.83"/>
      <rect class="beam" x="1" y="1" width="220" height="42" rx="10" ry="10" stroke-opacity="0.26" stroke-dasharray="0 60 60 386.83"/>
      <rect class="beam" x="1" y="1" width="220" height="42" rx="10" ry="10" stroke-opacity="0.42" stroke-dasharray="0 96 24 386.83"/>
    </g>
  </g>
  <rect class="beam" x="1" y="1" width="220" height="42" rx="10" ry="10" fill="none" stroke="#f2cc60" stroke-width="1.5" stroke-dasharray="0 96 24 386.83"/>
  <g transform="translate(21.5 12.9)" fill="none" stroke="#e3b341" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 16.2C10 16.2 2 11.4 2 6.2C2 3.8 3.9 2 6.1 2C7.7 2 9.2 2.9 10 4.3C10.8 2.9 12.3 2 13.9 2C16.1 2 18 3.8 18 6.2C18 11.4 10 16.2 10 16.2Z"/>
  </g>
  <text x="50.5" y="27" font-size="15" fill="#7ee787" textLength="135" lengthAdjust="spacing">Support my work</text>
  <rect class="cursor" x="189.5" y="14.5" width="9" height="16" fill="#7ee787" shape-rendering="crispEdges"/>
</svg>
