<svg xmlns="http://www.w3.org/2000/svg" width="440" height="153" viewBox="0 0 440 153" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-labelledby="title">
  <title id="title">My tools are free. If they save you time, you can support them — it's voluntary and nothing is expected in return.</title>
  <!-- Misma carrocería que banner2.svg. Efecto de «impresión»: cada línea está tapada por un rectángulo del color del
       fondo que se encoge de derecha a izquierda en pasos de un carácter. El estado de reposo (transform=scale(0 1)) es
       el final, con todo a la vista, así que un visor que no anime también ve el texto completo. -->
  <style>
    .cursor { animation: blink 1.1s step-end infinite }
    @keyframes blink { 50% { opacity: 0 } }
    .cv { transform-box: fill-box; transform-origin: 100% 50% }
    @keyframes print { from { transform: scaleX(1) } to { transform: scaleX(0) } }
    .r0 { animation: print 0.66s steps(47, end) 0.45s backwards }
    .r1 { animation: print 0.66s steps(47, end) 1.23s backwards }
    .r2 { animation: print 0.34s steps(24, end) 2.01s backwards }
    .rp { animation: print 0.01s steps(1, end) 2.46s backwards }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none } .cv { display: none } }
  </style>
  <defs>
    <clipPath id="card">
      <rect x="1" y="1" width="438" height="151" rx="14" ry="14"/>
    </clipPath>
  </defs>
  <rect x="1" y="1" width="438" height="151" rx="14" ry="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <g clip-path="url(#card)">
    <rect x="0" y="0" width="440" height="32" fill="#161b22"/>
    <line x1="0" y1="32" x2="440" y2="32" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="16" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="16" r="5" fill="#27c93f"/>
  </g>
  <text x="220" y="20" font-size="12" fill="#8b949e" text-anchor="middle" textLength="151.2" lengthAdjust="spacing">filonux@nix: ~/donate</text>
  <g font-size="14" fill="#c9d1d9">
    <text x="20" y="60" textLength="394.8" lengthAdjust="spacing"><tspan fill="#7ee787">#</tspan> My tools are free. If they save you time, you</text>
    <text x="20" y="81" textLength="394.8" lengthAdjust="spacing"><tspan fill="#7ee787">#</tspan> can support them — it's voluntary and nothing</text>
    <text x="20" y="102" textLength="201.6" lengthAdjust="spacing"><tspan fill="#7ee787">#</tspan> is expected in return.</text>
  </g>
  <text x="20" y="129" font-size="14" fill="#7ee787" textLength="176.4" lengthAdjust="spacing">filonux@nix:~/donate$</text>
  <rect class="cursor" x="204.8" y="117.5" width="10" height="15" fill="#7ee787" shape-rendering="crispEdges"/>
  <rect class="cv r0" transform="scale(0 1)" x="19.5" y="46" width="395.8" height="19" fill="#0d1117"/>
  <rect class="cv r1" transform="scale(0 1)" x="19.5" y="67" width="395.8" height="19" fill="#0d1117"/>
  <rect class="cv r2" transform="scale(0 1)" x="19.5" y="88" width="202.6" height="19" fill="#0d1117"/>
  <rect class="cv rp" transform="scale(0 1)" x="19.5" y="115" width="201.6" height="22" fill="#0d1117"/>
</svg>
